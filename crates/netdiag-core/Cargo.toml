[package]
name = "netdiag-core"
description = "Cross-platform local network discovery and diagnostics engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Deliberately free of any Tauri dependency: the engine builds and its tests run
# on a machine with no GUI toolchain installed, which is what keeps the scan
# logic verifiable independently of the desktop shell.
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true

if-addrs = "0.13"
socket2 = { version = "0.5", features = ["all"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
x509-parser = "0.16"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
